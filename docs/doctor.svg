<text y="77" xml:space="preserve"><tspan x="22.0" fill="#d0d0d0"> </tspan><tspan x="30.4" fill="#8a8a8a">──────────────────────────────────────────────────────────────────────────────────────────</tspan></text>
<text y="96" xml:space="preserve"></text>
<text y="115" xml:space="preserve"><tspan x="22.0" fill="#d0d0d0"> </tspan><tspan x="30.4" fill="#af87ff" font-weight="700">SETUP</tspan></text>
<text y="134" xml:space="preserve"><tspan x="22.0" fill="#d0d0d0">  </tspan><tspan x="38.8" fill="#87d787">✓</tspan><tspan x="47.2" fill="#d0d0d0"> </tspan><tspan x="55.6" fill="#bcbcbc">Python                        </tspan><tspan x="307.6" fill="#d0d0d0"> 3.12.3</tspan></text>
<text y="153" xml:space="preserve"><tspan x="22.0" fill="#d0d0d0">  </tspan><tspan x="38.8" fill="#8a8a8a">•</tspan><tspan x="47.2" fill="#d0d0d0"> </tspan><tspan x="55.6" fill="#bcbcbc">Config file                   </tspan><tspan x="307.6" fill="#d0d0d0"> </tspan><tspan x="316.0" fill="#8a8a8a">not created</tspan><tspan x="408.4" fill="#d0d0d0">  </tspan><tspan x="425.2" fill="#8a8a8a">optional; /mint:setup adds keys</tspan></text>
<text y="172" xml:space="preserve"><tspan x="22.0" fill="#d0d0d0">  </tspan><tspan x="38.8" fill="#8a8a8a">•</tspan><tspan x="47.2" fill="#d0d0d0"> </tspan><tspan x="55.6" fill="#bcbcbc">SOLANA_RPC_URL                </tspan><tspan x="307.6" fill="#d0d0d0"> </tspan><tspan x="316.0" fill="#8a8a8a">not set</tspan><tspan x="374.8" fill="#d0d0d0">  </tspan><tspan x="391.6" fill="#8a8a8a">Without it: the public RPC. Slow, and holder lists do not work.</tspan></text>
<text y="191" xml:space="preserve"><tspan x="22.0" fill="#d0d0d0">  </tspan><tspan x="38.8" fill="#8a8a8a">•</tspan><tspan x="47.2" fill="#d0d0d0"> </tspan><tspan x="55.6" fill="#bcbcbc">HELIUS_API_KEY                </tspan><tspan x="307.6" fill="#d0d0d0"> </tspan><tspan x="316.0" fill="#8a8a8a">not set</tspan><tspan x="374.8" fill="#d0d0d0">  </tspan><tspan x="391.6" fill="#8a8a8a">Without it: origin pages back through up to 10,000 signatures.</tspan></text>
<text y="210" xml:space="preserve"><tspan x="22.0" fill="#d0d0d0">  </tspan><tspan x="38.8" fill="#8a8a8a">•</tspan><tspan x="47.2" fill="#d0d0d0"> </tspan><tspan x="55.6" fill="#bcbcbc">BIRDEYE_API_KEY               </tspan><tspan x="307.6" fill="#d0d0d0"> </tspan><tspan x="316.0" fill="#8a8a8a">not set</tspan><tspan x="374.8" fill="#d0d0d0">  </tspan><tspan x="391.6" fill="#8a8a8a">Without it: GeckoTerminal, most liquid pool only.</tspan></text>
<text y="229" xml:space="preserve"><tspan x="22.0" fill="#d0d0d0">  </tspan><tspan x="38.8" fill="#8a8a8a">•</tspan><tspan x="47.2" fill="#d0d0d0"> </tspan><tspan x="55.6" fill="#bcbcbc">MINT_MAX_CALLS_PER_HOUR       </tspan><tspan x="307.6" fill="#d0d0d0"> </tspan><tspan x="316.0" fill="#8a8a8a">not set</tspan><tspan x="374.8" fill="#d0d0d0">  </tspan><tspan x="391.6" fill="#8a8a8a">Without it: 200. Stops a runaway loop from burning credits.</tspan></text>
<text y="248" xml:space="preserve"></text>
<text y="267" xml:space="preserve"><tspan x="22.0" fill="#d0d0d0"> </tspan><tspan x="30.4" fill="#af87ff" font-weight="700">USAGE THIS HOUR</tspan></text>
<text y="286" xml:space="preserve"><tspan x="22.0" fill="#d0d0d0">  </tspan><tspan x="38.8" fill="#87d787">✓</tspan><tspan x="47.2" fill="#d0d0d0"> </tspan><tspan x="55.6" fill="#bcbcbc">api.dexscreener.com           </tspan><tspan x="307.6" fill="#d0d0d0"> 1 / 200</tspan></text>
<text y="305" xml:space="preserve"><tspan x="22.0" fill="#d0d0d0">  </tspan><tspan x="38.8" fill="#87d787">✓</tspan><tspan x="47.2" fill="#d0d0d0"> </tspan><tspan x="55.6" fill="#bcbcbc">api.geckoterminal.com         </tspan><tspan x="307.6" fill="#d0d0d0"> 1 / 200</tspan></text>
<text y="324" xml:space="preserve"><tspan x="22.0" fill="#d0d0d0">  </tspan><tspan x="38.8" fill="#87d787">✓</tspan><tspan x="47.2" fill="#d0d0d0"> </tspan><tspan x="55.6" fill="#bcbcbc">api.mainnet-beta.solana.com   </tspan><tspan x="307.6" fill="#d0d0d0"> 8 / 200</tspan></text>
<text y="343" xml:space="preserve"></text>
