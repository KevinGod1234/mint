<text y="381" xml:space="preserve"><tspan x="22.0" fill="#d0d0d0">  </tspan><tspan x="38.8" fill="#87d787">✓</tspan><tspan x="47.2" fill="#d0d0d0"> </tspan><tspan x="55.6" fill="#bcbcbc">Solana RPC                    </tspan><tspan x="307.6" fill="#d0d0d0"> slot 457,005,348 · https://api.mainnet-beta.solana.com  </tspan><tspan x="786.4" fill="#8a8a8a">70 ms</tspan></text>
<text y="400" xml:space="preserve"><tspan x="22.0" fill="#d0d0d0">  </tspan><tspan x="38.8" fill="#ffd75f">!</tspan><tspan x="47.2" fill="#d0d0d0"> </tspan><tspan x="55.6" fill="#bcbcbc">Holder lists                  </tspan><tspan x="307.6" fill="#d0d0d0"> </tspan><tspan x="316.0" fill="#ffd75f">not available</tspan><tspan x="425.2" fill="#d0d0d0">  </tspan><tspan x="442.0" fill="#8a8a8a">the public RPC refuses this; set SOLANA_RPC_URL</tspan></text>
<text y="419" xml:space="preserve"><tspan x="22.0" fill="#d0d0d0">  </tspan><tspan x="38.8" fill="#87d787">✓</tspan><tspan x="47.2" fill="#d0d0d0"> </tspan><tspan x="55.6" fill="#bcbcbc">GeckoTerminal                 </tspan><tspan x="307.6" fill="#d0d0d0"> free, 30 calls/min  </tspan><tspan x="484.0" fill="#8a8a8a">53 ms</tspan></text>
